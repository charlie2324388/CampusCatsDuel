<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=contain">
<meta name="theme-color" content="#14202e">
<title>$GODOT_PROJECT_NAME</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#111b26;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#canvas{display:block;width:100%;height:100%;border:0;outline:none;touch-action:none;-webkit-touch-callout:none}
#boot{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:22px;background:#14202e;color:#fbf2dc}
h1{font-size:clamp(22px,5vw,42px);letter-spacing:.08em;margin:0}p{margin:0;font-size:15px;line-height:1.55;color:#ded6c7}
progress{width:min(280px,76vw);height:8px;margin:5px auto;accent-color:#ffb167}
button{margin:auto;padding:8px 20px;border:1px solid #ffbd83;border-radius:30px;color:#ffe5be;background:#333f46}
[hidden]{display:none!important}#turn{display:none;position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));margin:0;text-align:center;color:#ffe4ba;pointer-events:none;font-size:14px}
@media (orientation:portrait) and (pointer:coarse){#turn{display:block}}
</style>$GODOT_HEAD_INCLUDE</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="课间猫擂台游戏画面"></canvas>
<div id="boot"><h1>课间猫擂台</h1><p id="status" role="status">正在载入擂台…</p><progress id="progress"></progress><button id="retry" hidden>重新载入</button></div>
<p id="turn">横过手机，双手操控更顺手</p>
<script src="$GODOT_URL"></script>
<script>
(function () {
  const status=document.getElementById("status"), meter=document.getElementById("progress"), retry=document.getElementById("retry");
  function failure(message){status.textContent=message;meter.hidden=true;retry.hidden=false;}
  retry.onclick=()=>location.reload();
  if(!window.isSecureContext){failure("请通过受信任的 HTTPS 地址打开游戏。");return;}
  const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
  if(missing.length){failure("此浏览器缺少运行支持："+missing.join("、"));return;}
  const engine=new Engine($GODOT_CONFIG);
  engine.startGame({canvas:document.getElementById("canvas"),onProgress:(done,total)=>{
    if(total){meter.max=total;meter.value=done;status.textContent="正在载入擂台… "+Math.round(100*done/total)+"%";}
  }}).then(()=>{document.getElementById("boot").remove();document.getElementById("canvas").focus();}).catch(err=>{
    console.error(err);failure("擂台载入失败。请检查网络，再重新载入。");
  });
})();
</script></body></html>
